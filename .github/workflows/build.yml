name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lab2-cicd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test
