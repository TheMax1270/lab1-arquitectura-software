name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lab2-cicd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Analyze with SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=devconnect
          -Dsonar.projectKey=TheMax1270_lab1-arquitectura-software
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Build JAR
        run: ./mvnw package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: lab12026p-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin

      - name: Build Docker image
        run: docker build --file Dockerfile --tag max127085/lab12026p:latest .

      - name: Push Docker image
        run: docker push max127085/lab12026p:latest
